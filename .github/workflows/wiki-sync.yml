name: Wiki Sync (Reusable)

# Called by individual repos on push to main.
# Runs gitnexus analyze + wiki, then syncs pages into boxtalk-kb.
#
# Usage in a calling repo (.github/workflows/wiki-sync.yml):
#
#   on:
#     push:
#       branches: [main]
#
#   jobs:
#     wiki-sync:
#       uses: BoxTalk/boxtalk-shared-workflows/.github/workflows/wiki-sync.yml@main
#       with:
#         repo_dir: boxtalk-api        # directory name of this repo
#         kb_name: boxtalk-api         # folder name in boxtalk-kb/wiki/
#       secrets:
#         CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
#         KB_PAT: ${{ secrets.KB_PAT }}

on:
  workflow_call:
    inputs:
      repo_dir:
        description: 'Directory name of this repo (must match REPO_MAP key in sync-wiki.py)'
        required: true
        type: string
      kb_name:
        description: 'Folder name in boxtalk-kb/wiki/ for this repo'
        required: true
        type: string
      run_migration_ingest:
        description: 'Run ingest-migrations.py + synthesize-schema-wiki.py (tenant_manager only)'
        required: false
        type: boolean
        default: false
      node_version:
        description: 'Node.js version for GitNexus'
        required: false
        type: string
        default: '22'
    secrets:
      CURSOR_API_KEY:
        description: 'Cursor API key — same one used by the PR review bot (already set at org level)'
        required: true
      KB_PAT:
        description: 'GitHub PAT with write access to BoxTalk/boxtalk-kb'
        required: true

jobs:
  wiki-sync:
    runs-on: ubuntu-latest

    # Serialize all wiki-sync jobs so concurrent pushes don't conflict
    # when committing to boxtalk-kb. Uses queue (cancel-in-progress: false)
    # so every push eventually gets processed.
    concurrency:
      group: boxtalk-kb-write
      cancel-in-progress: false

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install GitNexus and Cursor CLI
        run: |
          npm install -g gitnexus
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "GitNexus $(gitnexus --version)"

      - name: Wrap cursor-agent to bypass workspace trust in CI
        run: |
          set -e
          echo "PATH=$PATH"
          echo "Locating cursor-agent..."
          CURSOR_BIN=$(which cursor-agent)
          echo "Found at: $CURSOR_BIN"
          ls -la "$CURSOR_BIN"
          cp "$CURSOR_BIN" "${CURSOR_BIN}.real"
          printf '#!/bin/bash\nexec "%s.real" --yolo "$@"\n' "$CURSOR_BIN" > "$CURSOR_BIN"
          chmod +x "$CURSOR_BIN"
          echo "Wrapper installed. Contents:"
          cat "$CURSOR_BIN"

      - name: Configure GitNexus → Cursor CLI
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          mkdir -p ~/.gitnexus
          # Cursor CLI backend — same model used by the PR review bot
          echo '{"provider":"cursor","model":"claude-4-sonnet"}' > ~/.gitnexus/config.json

      - name: Index repository
        run: gitnexus analyze

      - name: Generate wiki
        run: echo "n" | gitnexus wiki
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        timeout-minutes: 60

      - name: Checkout boxtalk-kb
        uses: actions/checkout@v4
        with:
          repository: BoxTalk/boxtalk-kb
          token: ${{ secrets.KB_PAT }}
          path: boxtalk-kb

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync wiki pages for this repo
        run: |
          cd boxtalk-kb
          python3 scripts/sync-wiki.py --only ${{ inputs.repo_dir }}
        env:
          # Point the script at the checked-out repo root (not local ~/workspace path)
          REPO_SRC_DIR: ${{ github.workspace }}

      - name: Run migration ingest + schema synthesis
        if: inputs.run_migration_ingest
        run: |
          cd boxtalk-kb
          python3 scripts/ingest-migrations.py
          python3 scripts/synthesize-schema-wiki.py
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BOXTALK_DIR: ${{ github.workspace }}/..

      - name: Commit and push wiki changes
        run: |
          cd boxtalk-kb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "chore(wiki): sync ${{ inputs.repo_dir }} @ ${{ github.sha }}"
            git push
          fi
