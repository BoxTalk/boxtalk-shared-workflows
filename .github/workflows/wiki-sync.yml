name: Wiki Sync (Reusable)

# Called by individual repos on push to main.
# Runs gitnexus analyze + wiki, then syncs pages into boxtalk-kb.
#
# Usage in a calling repo (.github/workflows/wiki-sync.yml):
#
#   on:
#     push:
#       branches: [main]
#
#   jobs:
#     wiki-sync:
#       uses: BoxTalk/boxtalk-shared-workflows/.github/workflows/wiki-sync.yml@main
#       with:
#         repo_dir: boxtalk-api
#         kb_name: boxtalk-api
#       secrets:
#         CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
#         KB_PAT: ${{ secrets.KB_PAT }}

on:
  workflow_call:
    inputs:
      repo_dir:
        description: 'Directory name of this repo (must match REPO_MAP key in sync-wiki.py)'
        required: true
        type: string
      kb_name:
        description: 'Folder name in boxtalk-kb/wiki/ for this repo'
        required: true
        type: string
      run_migration_ingest:
        description: 'Run ingest-migrations.py + synthesize-schema-wiki.py (tenant_manager only)'
        required: false
        type: boolean
        default: false
      node_version:
        description: 'Node.js version for GitNexus'
        required: false
        type: string
        default: '22'
    secrets:
      CURSOR_API_KEY:
        description: 'Cursor API key — same one used by the PR review bot (already set at org level)'
        required: true
      KB_PAT:
        description: 'GitHub PAT with write access to BoxTalk/boxtalk-kb'
        required: true

jobs:
  wiki-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: boxtalk-kb-write
      cancel-in-progress: false

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install GitNexus and Cursor CLI
        run: |
          set -e
          npm install -g gitnexus
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GitNexus $(gitnexus --version)"

      - name: Wrap Cursor agent to bypass workspace trust
        run: |
          set -e
          echo "Cursor CLI binaries in ~/.local/bin:"
          ls "$HOME/.local/bin/" | grep -E "agent|cursor" || echo "(none found)"

          REAL_AGENT="$HOME/.local/bin/agent"
          if [ ! -f "$REAL_AGENT" ]; then
            echo "ERROR: agent not found at $REAL_AGENT"
            exit 1
          fi

          # Replace agent in-place with a wrapper that adds --trust
          cp "$REAL_AGENT" "${REAL_AGENT}.real"
          printf '#!/bin/bash\nexec "%s.real" --trust "$@"\n' "$REAL_AGENT" > "$REAL_AGENT"
          chmod +x "$REAL_AGENT"

          # Also expose as cursor-agent — gitnexus provider check looks for this name
          ln -sf "$REAL_AGENT" "$HOME/.local/bin/cursor-agent"

          echo "Wrappers ready:"
          ls -la "$HOME/.local/bin/agent" "$HOME/.local/bin/cursor-agent"

      - name: Configure GitNexus to use Cursor CLI
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          mkdir -p "$HOME/.gitnexus"
          printf '{"provider":"cursor","model":"claude-4-sonnet"}\n' > "$HOME/.gitnexus/config.json"

      - name: Index repository
        run: gitnexus analyze

      - name: Generate wiki
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: gitnexus wiki
        timeout-minutes: 60

      - name: Checkout boxtalk-kb
        uses: actions/checkout@v4
        with:
          repository: BoxTalk/boxtalk-kb
          token: ${{ secrets.KB_PAT }}
          path: boxtalk-kb

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync wiki pages for this repo
        run: |
          set -e
          cd boxtalk-kb
          python3 scripts/sync-wiki.py --only ${{ inputs.repo_dir }}
        env:
          REPO_SRC_DIR: ${{ github.workspace }}

      - name: Run migration ingest + schema synthesis
        if: inputs.run_migration_ingest
        run: |
          set -e
          cd boxtalk-kb
          python3 scripts/ingest-migrations.py
          python3 scripts/synthesize-schema-wiki.py
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MIGRATIONS_DIR: ${{ github.workspace }}/migrations/schema

      - name: Commit and push wiki changes
        run: |
          set -e
          cd boxtalk-kb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "chore(wiki): sync ${{ inputs.repo_dir }} @ ${{ github.sha }}"
            git push
          fi
